[project]
name = "autoprep-ai-backend"
version = "0.1.0"
description = "AutoPrep AI FastAPI Modular Monolith"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
    "boto3>=1.35.0",
    "redis>=5.2.0",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.2",
    "joblib>=1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"